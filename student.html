<script>
const $=s=>document.querySelector(s), view=$('#view'); let route='/';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const student={id:'st-001',name:'Марія Коваленко',group:'МЕН-31',program:'073 · Менеджмент',faculty:'Факультет економіки, соціальних технологій та туризму',gpa:88.4,ects:152,total:240};
const week=[
  {day:'Пн',items:[['09:00','Стратегічний менеджмент','Лекція · 214',''],['10:35','Стратегічний менеджмент','Практичне · 214','practice'],['12:20','Іноземна мова B2','Практичне · 118','practice']]},
  {day:'Вт',items:[['09:00','Управління персоналом','Лекція · 305',''],['10:35','Фінансовий менеджмент','Лекція · 401',''],['12:20','Фінансовий менеджмент','Практичне · 401','practice'],['13:55','Цифрові технології','Лабораторна · 12','lab']]},
  {day:'Ср',items:[['10:35','Маркетинговий менеджмент','Лекція · 214',''],['12:20','Маркетинговий менеджмент','Практичне · 214','practice']]},
  {day:'Чт',items:[['09:00','Операційний менеджмент','Лекція · 309',''],['10:35','Операційний менеджмент','Практичне · 309','practice'],['12:20','Управління проєктами','Лекція · 405','']]},
  {day:'Пт',items:[['09:00','Іноземна мова B2','Практичне · 118','practice'],['10:35','Управління проєктами','Практичне · 401','practice']]}
];
const exams=[['Стратегічний менеджмент','24.08 · 09:00','Іспит','Очікується'],['Курсова робота','28.08 · 11:00','Захист','Очікується'],['Маркетинговий менеджмент','19.06','Іспит','92 · A']];
function S(){return APSVT.get()}function pct(a,b){return Math.round(a/b*100)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('open');setTimeout(()=>$('#modal input, #modal textarea, #modal select')?.focus(),30)}function closeModal(){$('#modalBack').classList.remove('open')}
function tag(st){const m={new:['Нове','blue'],progress:['В обробці','amber'],ready:['Готово','green'],closed:['Закрито','gray'],urgent:['Терміново','red'],open:['Відкрито','blue']};const x=m[st]||[st,'gray'];return `<span class="status ${x[1]}">${x[0]}</span>`}
function header(ey,title,desc,actions=''){return `<div class="page-head reveal"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function dashboard(){const s=S(), req=s.requests.filter(x=>x.studentId===student.id), notes=s.announcements.filter(x=>x.published), openTickets=s.tickets.filter(x=>x.studentId===student.id&&x.status!=='closed');view.innerHTML=header('Середа · 15 липня 2026','Доброго дня, Маріє.','Усе важливе на сьогодні — без пошуку в різних системах.',`<button class="btn btn-ghost" data-go="/support">Попросити допомогу</button>`) + `
<div class="grid split">
 <section class="card hero reveal"><div><div class="eyebrow">Наступна дія · сьогодні</div><h2>Завершіть кейс до пʼятниці</h2><p>«Вихід на новий ринок» із стратегічного менеджменту. Чернетку збережено, залишилося додати фінансову модель.</p></div><button class="btn" data-go="/tasks">Продовжити завдання →</button></section>
 <section class="card pad reveal"><div class="row"><h2>У фокусі</h2><span class="status red">3 дії</span></div><div class="priority"><b class="priority-time">12:20</b><div><b>Маркетинговий менеджмент</b><span>Практичне · ауд. 214</span></div><span class="status blue">Сьогодні</span></div><div class="priority"><b class="priority-time">18 лип</b><div><b>Здати кейс</b><span>Стратегічний менеджмент</span></div><span class="status red">3 дні</span></div><div class="priority"><b class="priority-time">25 сер</b><div><b>Оплата контракту</b><span>26 400 грн</span></div><span class="status amber">Очікується</span></div></section>
 </div>
 <div class="grid grid-4" style="margin-top:17px"><section class="card metric reveal"><div class="metric-label">Середній бал</div><div class="metric-value">${student.gpa}</div><div class="metric-foot">Топ 18% потоку · шкала B</div></section><section class="card metric yellow reveal"><div class="metric-label">Прогрес програми</div><div class="metric-value">${pct(student.ects,student.total)}%</div><div class="progress"><i style="width:${pct(student.ects,student.total)}%"></i></div><div class="metric-foot" style="margin-top:8px">${student.ects} з ${student.total} ЄКТС</div></section><section class="card metric green reveal"><div class="metric-label">Відвідування</div><div class="metric-value">91%</div><div class="metric-foot">+2% за останні 4 тижні</div></section><section class="card metric red reveal"><div class="metric-label">Відкриті звернення</div><div class="metric-value">${req.filter(x=>x.status!=='ready').length+openTickets.length}</div><div class="metric-foot">Остання відповідь сьогодні</div></section></div>
 <div class="grid grid-2" style="margin-top:17px"><section class="card pad reveal"><div class="row"><h2>Оголошення для вас</h2><button class="btn btn-ghost btn-sm" data-act="markNews">Прочитано</button></div><ul class="list">${notes.slice(0,3).map(n=>`<li><div class="row"><span class="status ${n.tag==='Важливо'?'red':'blue'}">${esc(n.tag)}</span><span class="mono muted" style="font-size:10px">${n.date}</span></div><b style="display:block;margin-top:8px">${esc(n.title)}</b><p class="muted">${esc(n.body)}</p></li>`).join('')}</ul></section><section class="card notice reveal"><div class="eyebrow">Розклад · ${s.schedule.version}</div><h2>${esc(s.schedule.note)}</h2><p style="margin-top:9px">Опубліковано ${s.schedule.publishedAt}. Зміна вже відображена у тижневому розкладі.</p><button class="btn btn-dark" style="margin-top:20px" data-go="/schedule">Переглянути розклад</button></section></div>`}
function schedule(){const s=S();const slots=['09:00','10:35','12:20','13:55'];view.innerHTML=header('Навчальний процес','Розклад занять',`МЕН-31 · версія ${s.schedule.version} · опубліковано ${s.schedule.publishedAt}`,`<button class="btn btn-ghost" data-act="calendar">Додати в календар</button>`) + `<div class="tabs"><button class="chip active">Чисельник</button><button class="chip">Знаменник</button><button class="chip">Сесія</button></div><section class="card pad reveal table-wrap"><div class="schedule"><div></div>${week.map(w=>`<div class="day">${w.day}</div>`).join('')}${slots.map((time,si)=>`<div class="time"><b>${si+1} пара</b><br>${time}</div>${week.map(w=>{const l=w.items.find(x=>x[0]===time);return l?`<div class="lesson ${l[3]}"><b>${esc(l[1])}</b><span>${esc(l[2])}</span><span>${time}</span></div>`:`<div class="lesson empty">вільно</div>`}).join('')}`).join('')}</div></section><section class="card pad reveal" style="margin-top:17px"><div class="row"><div><div class="eyebrow">Оновлення</div><b>${esc(s.schedule.note)}</b></div><span class="status green">Підтверджено</span></div></section>`}
function tasks(){const tasks=S().tasks;view.innerHTML=header('Єдина стрічка дедлайнів','Завдання та дедлайни','Завдання з навчальних систем зібрані в одному місці. У прототипі показано майбутню інтеграцію через LTI.',`<button class="btn btn-primary" data-act="planner">Спланувати тиждень</button>`) + `<div class="grid split"><section class="card pad reveal"><div class="row"><h2>Найближчі</h2><span class="muted">${tasks.length} відкриті</span></div>${tasks.map(t=>`<div class="deadline"><div class="datebox"><b>${t.day}</b><span>${t.month}</span></div><div><b>${esc(t.title)}</b><div class="muted">${esc(t.course)} · вага ${t.weight}<br>до ${t.due}</div></div>${tag(t.state)}</div>`).join('')}</section><aside class="grid"><section class="card pad reveal"><h2>Навантаження тижня</h2><div class="chart">${[35,68,82,48,74,26,12].map((h,i)=>`<div class="bar" style="height:${h}%"><span>${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'][i]}</span></div>`).join('')}</div></section><section class="card pad reveal"><div class="eyebrow">Рекомендація</div><h2>Забронуйте 90 хв у четвер</h2><p class="muted" style="margin-top:8px">Це зменшить навантаження пʼятниці перед дедлайном кейсу.</p><button class="btn btn-yellow" style="margin-top:14px" data-act="focus">Додати фокус-сесію</button></section></aside></div>`}
function progress(){const s=S(), att=s.attendance;const avg=Math.round(att.reduce((a,x)=>a+x.attended/x.total*100,0)/att.length);view.innerHTML=header('Моя академічна траєкторія','Прогрес і результати','Оцінки, відвідування, кредити ЄКТС та екзаменаційна сесія в одному контексті.',`<button class="btn btn-ghost" data-go="/documents">Замовити транскрипт</button>`) + `<div class="grid grid-3"><section class="card pad reveal"><div class="score-ring" style="--score:${student.gpa}" data-label="${student.gpa}"></div><h2 style="margin-top:15px">Середній бал</h2><p class="muted">Результат за 5 завершених семестрів.</p></section><section class="card pad reveal"><div class="metric-value">${student.ects}<span style="font-size:14px"> / ${student.total}</span></div><h2>Кредити ЄКТС</h2><div class="progress" style="margin:13px 0"><i style="width:${pct(student.ects,student.total)}%"></i></div><p class="muted">40 кредитів поточного семестру — у процесі.</p></section><section class="card pad reveal"><div class="metric-value">${avg}%</div><h2>Відвідування</h2><p class="muted">Немає дисциплін нижче рекомендованого порогу 75%.</p></section></div><div class="grid grid-2" style="margin-top:17px"><section class="card reveal"><div class="card-head"><h2>Останні оцінки</h2><span class="status green">Опубліковано</span></div><div class="table-wrap"><table><thead><tr><th>Дисципліна</th><th>Робота</th><th class="num">Бал</th><th>Дата</th></tr></thead><tbody>${s.grades.map(g=>`<tr><td class="table-title">${esc(g.course)}</td><td>${esc(g.kind)}</td><td class="num"><b>${g.score}</b></td><td class="muted">${g.publishedAt}</td></tr>`).join('')}</tbody></table></div></section><section class="card pad reveal"><div class="row"><h2>Відвідування за курсами</h2><span class="muted">цей семестр</span></div><ul class="list">${att.map(a=>`<li><div class="row"><b>${esc(a.course)}</b><span class="mono">${pct(a.attended,a.total)}%</span></div><div class="progress" style="margin-top:8px"><i style="width:${pct(a.attended,a.total)}%;background:${pct(a.attended,a.total)<80?'var(--amber)':'var(--green)'}"></i></div></li>`).join('')}</ul></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Літня сесія</h2><span class="muted">2025/26</span></div><div class="table-wrap"><table><thead><tr><th>Дисципліна</th><th>Дата</th><th>Форма</th><th>Статус</th></tr></thead><tbody>${exams.map(e=>`<tr><td class="table-title">${e[0]}</td><td>${e[1]}</td><td>${e[2]}</td><td>${e[3].includes('Очіку')?tag('open'):`<span class="status green">${e[3]}</span>`}</td></tr>`).join('')}</tbody></table></div></section>`}
function documents(){const s=S(), req=s.requests.filter(x=>x.studentId===student.id);view.innerHTML=header('Документи без черг','Документи та запити','Цифрові довідки, індивідуальний план, транскрипти та прозорі статуси опрацювання.',`<button class="btn btn-primary" data-act="newRequest">Новий запит</button>`) + `<div class="grid grid-2"><section class="card pad reveal"><div class="row"><h2>Мої цифрові документи</h2><span class="status green">2 чинні</span></div><ul class="list">${s.documents.map(d=>`<li><div class="row mobile-stack"><div><b>${esc(d.name)}</b><div class="muted">${d.format} · видано ${d.issued}</div></div><button class="btn btn-ghost btn-sm" data-act="download">Відкрити</button></div></li>`).join('')}</ul></section><section class="card pad reveal"><h2>Що можна замовити</h2><ul class="list"><li><b>Академічний транскрипт</b><p class="muted">Українською або англійською · PDF з КЕП / папір</p></li><li><b>Довідка про навчання</b><p class="muted">Для роботодавця, банку або державної установи</p></li><li><b>Витяг з індивідуального плану</b><p class="muted">Дисципліни, кредити, форми контролю</p></li></ul></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Історія запитів</h2><span class="muted">SLA до 2 робочих днів</span></div><div class="table-wrap"><table><thead><tr><th>Запит</th><th>Подано</th><th>Відповідальний</th><th>Строк</th><th>Статус</th></tr></thead><tbody>${req.map(r=>`<tr><td><b>${esc(r.type)}</b><div class="table-sub">${esc(r.detail)}</div></td><td>${r.date}</td><td>${esc(r.owner)}</td><td>${r.due}</td><td>${tag(r.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
function finance(){const live=S().payments.filter(x=>x.studentId===student.id),next=live.find(x=>x.status!=='paid')||{amount:0,due:'—',period:'Усі платежі виконано',status:'paid'};const paymentStatus=p=>p.status==='paid'?'<span class="status green">Сплачено</span>':p.status==='overdue'?'<span class="status red">Прострочено</span>':p.status==='installment'?'<span class="status amber">Розтермінування</span>':'<span class="status blue">Очікується</span>';view.innerHTML=header('Контракт і платежі','Фінанси','Стан договору, майбутні платежі, квитанції та безпечний канал до бухгалтерії.',`<button class="btn btn-ghost" data-go="/support">Питання бухгалтерії</button>`) + `<div class="grid split"><section class="card hero reveal" style="background:var(--navy)"><div><div class="eyebrow">${next.status==='paid'?'Платежі актуальні':'Наступний платіж · до '+next.due}</div><h2>${next.amount.toLocaleString('uk-UA')} грн</h2><p>${esc(next.period)}. Статус оновлюється після підтвердження бухгалтерією.</p></div><button class="btn" data-act="receipt">Сформувати квитанцію</button></section><section class="card pad reveal"><h2>Статус контракту</h2><ul class="list"><li><div class="row"><span>Договір</span><b>№1148-МЕН</b></div></li><li><div class="row"><span>Поточний статус</span>${paymentStatus(next)}</div></li><li><div class="row"><span>Сплачено за 2025/26</span><b>49 600 грн</b></div></li><li><div class="row"><span>Остання синхронізація</span><b>${S().updatedAt}</b></div></li></ul></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Платіжний план</h2><span class="status green">Дані бухгалтерії</span></div><div class="table-wrap"><table><thead><tr><th>Період</th><th>Строк</th><th class="num">Сума</th><th>План</th><th>Статус</th></tr></thead><tbody>${live.map(p=>`<tr><td class="table-title">${esc(p.period)}</td><td>${p.due}</td><td class="num">${p.amount.toLocaleString('uk-UA')} грн</td><td>${esc(p.plan)}</td><td>${paymentStatus(p)}</td></tr>`).join('')}</tbody></table></div></section>`}
function career(){view.innerHTML=header('Від навчання до професії','Карʼєра та можливості','Навички з освітньої програми, практика, вакансії, міжнародна мобільність і консультації.',`<button class="btn btn-primary" data-act="career">Записатися на консультацію</button>`) + `<div class="grid grid-3"><section class="card metric reveal"><div class="metric-label">Профіль навичок</div><div class="metric-value">68%</div><div class="metric-foot">12 навичок підтверджено курсами</div></section><section class="card metric yellow reveal"><div class="metric-label">Відкриті можливості</div><div class="metric-value">14</div><div class="metric-foot">5 стажувань · 3 програми мобільності</div></section><section class="card metric green reveal"><div class="metric-label">Карʼєрний план</div><div class="metric-value">4/6</div><div class="metric-foot">Наступне: перевірка CV</div></section></div><div class="grid grid-2" style="margin-top:17px"><section class="card pad reveal"><h2>Ваші сильні навички</h2><ul class="list">${[['Проєктний менеджмент',82],['Аналітика даних',74],['Командна комунікація',89],['Фінансове планування',66]].map(x=>`<li><div class="row"><b>${x[0]}</b><span class="mono">${x[1]}%</span></div><div class="progress" style="margin-top:8px"><i style="width:${x[1]}%"></i></div></li>`).join('')}</ul></section><section class="card pad reveal"><div class="row"><h2>Для вас</h2><span class="status blue">14 збігів</span></div><ul class="list"><li><span class="status amber">Стажування</span><b style="display:block;margin-top:8px">Junior Project Coordinator</b><p class="muted">Гібридно · Київ · дедлайн 26 липня</p></li><li><span class="status blue">Мобільність</span><b style="display:block;margin-top:8px">Erasmus+ · Business Administration</b><p class="muted">Осінь 2026 · 5 місць · B2 English</p></li><li><span class="status green">Подія</span><b style="display:block;margin-top:8px">Career Lab: як говорити про досвід</b><p class="muted">22 липня · 16:00 · онлайн</p></li></ul></section></div>`}
function support(){const s=S(), mine=s.tickets.filter(t=>t.studentId===student.id);view.innerHTML=header('Людина поруч, коли потрібно','Підтримка і добробут','Академічна, цифрова, фінансова, психологічна та інклюзивна підтримка з єдиною історією звернень.',`<button class="btn btn-primary" data-act="newTicket">Нове звернення</button>`) + `<div class="grid grid-3"><section class="card pad reveal"><div class="eyebrow">Навчання</div><h2>Деканат</h2><p class="muted" style="margin-top:8px">Розклад, оцінки, індивідуальний план, документи.</p><b style="display:block;margin-top:14px">Пн–Пт · 09:00–17:00</b></section><section class="card pad reveal"><div class="eyebrow">Цифрові сервіси</div><h2>IT help desk</h2><p class="muted" style="margin-top:8px">Доступ, Moodle, пошта, багатофакторний вхід.</p><b style="display:block;margin-top:14px">Відповідь до 4 годин</b></section><section class="card pad reveal"><div class="eyebrow">Безпека і добробут</div><h2>Конфіденційна допомога</h2><p class="muted" style="margin-top:8px">Психолог, координатор доступності, кризова підтримка.</p><b style="display:block;margin-top:14px">Запис без деталізації теми</b></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Мої звернення</h2><span class="muted">Відповіді також приходять на пошту</span></div><div class="table-wrap"><table><thead><tr><th>Тема</th><th>Повідомлення</th><th>Відповідальний</th><th>Статус</th></tr></thead><tbody>${mine.map(t=>`<tr><td class="table-title">${esc(t.topic)}</td><td>${esc(t.message)}</td><td>${esc(t.owner)}</td><td>${tag(t.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
function profile(){view.innerHTML=header('Особиста справа і безпека','Профіль','Перевірте контакти, налаштуйте доступність і контролюйте активні сеанси.',`<button class="btn btn-ghost" data-act="editProfile">Запит на зміну даних</button>`) + `<div class="grid split"><section class="card profile-hero reveal"><span class="avatar">МК</span><h2>${student.name}</h2><p>${student.program}<br>${student.faculty}<br>Група ${student.group} · денна форма</p><div style="margin-top:18px"><span class="status green">Активний статус</span></div></section><div class="grid"><section class="card pad reveal"><h2>Контакти</h2><ul class="list"><li><div class="row"><span class="muted">Пошта Академії</span><b>m.kovalenko@st.socosvita.kiev.ua</b></div></li><li><div class="row"><span class="muted">Телефон</span><b>+38 (067) ••• •• 42</b></div></li><li><div class="row"><span class="muted">Куратор</span><b>Ольга Гринчук</b></div></li></ul></section><section class="card pad reveal"><div class="row"><h2>Безпека акаунта</h2><span class="status green">Захищено</span></div><ul class="list"><li><div class="row"><div><b>Двоетапна перевірка</b><p class="muted">Застосунок автентифікації</p></div><button class="btn btn-ghost btn-sm" data-act="security">Керувати</button></div></li><li><div class="row"><div><b>Активні сеанси</b><p class="muted">Safari · macOS · Київ · зараз</p></div><span class="status green">Цей пристрій</span></div></li><li><div class="row"><div><b>Конфіденційність</b><p class="muted">Керуйте згодами і сповіщеннями</p></div><button class="btn btn-ghost btn-sm" data-act="privacy">Налаштувати</button></div></li></ul></section></div></div>`}
const routes={'/':dashboard,'/schedule':schedule,'/tasks':tasks,'/progress':progress,'/documents':documents,'/finance':finance,'/career':career,'/support':support,'/profile':profile};
function go(p){route=routes[p]?p:'/';routes[route]();document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===route));const s=S();$('#syncText').textContent='Синхр. '+s.updatedAt.split(' · ').pop();$('#taskCount').textContent=s.tasks.length;$('#requestCount').textContent=s.requests.filter(r=>r.studentId===student.id&&r.status!=='ready').length;scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#/"]');if(link){e.preventDefault();go(link.getAttribute('href').slice(1)||'/');return}const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;if(act==='contrast'){document.body.classList.toggle('high-contrast');toast('Контрастність змінено')}else if(act==='type'){document.body.classList.toggle('large-type');toast('Розмір тексту змінено')}else if(act==='newRequest')requestModal();else if(act==='newTicket')ticketModal();else if(act==='receipt'||act==='download'||act==='calendar'){toast(act==='calendar'?'Календар підготовлено для синхронізації':'Файл підготовлено · демо-дія')}else if(act==='career'){toast('Консультацію заброньовано на 22 липня · 15:30')}else if(act==='planner'||act==='focus'){toast('Фокус-сесію додано до плану тижня')}else if(act==='markNews'){toast('Оголошення позначено прочитаними')}else if(['editProfile','security','privacy'].includes(act)){toast('Налаштування відкрито · демо-дія')}});
function requestModal(){modal(`<h2>Новий запит на документ</h2><div class="field"><label>Документ</label><select class="input" id="rqType"><option>Довідка про навчання</option><option>Академічний транскрипт</option><option>Витяг з індивідуального плану</option></select></div><div class="field"><label>Формат</label><select class="input" id="rqFormat"><option>Українською · PDF з КЕП</option><option>Англійською · PDF з КЕП</option><option>Паперовий примірник</option></select></div><div class="field"><label>Призначення</label><textarea class="input" id="rqNote" rows="3" placeholder="Наприклад: для подання роботодавцю"></textarea></div><div class="modal-foot"><button class="btn btn-ghost" data-act="close">Скасувати</button><button class="btn btn-primary" id="submitRequest">Надіслати</button></div>`);setTimeout(()=>$('#submitRequest').onclick=()=>{APSVT.update(st=>{st.requests.unshift({id:'r'+Date.now(),studentId:student.id,student:student.name,group:student.group,type:$('#rqType').value,detail:$('#rqFormat').value+(($('#rqNote').value.trim())?' · '+$('#rqNote').value.trim():''),date:new Date().toLocaleDateString('uk-UA'),status:'new',owner:'Не призначено',due:'до 2 робочих днів'})},'student-request');closeModal();toast('Запит надіслано до адміністрації');go('/documents')},20)}
function ticketModal(){modal(`<h2>Нове звернення</h2><div class="field"><label>Напрям</label><select class="input" id="tkTopic"><option>Розклад і навчальний процес</option><option>Оцінки та перескладання</option><option>Фінансова консультація</option><option>Цифрові сервіси</option><option>Психологічна підтримка</option><option>Доступність та інклюзія</option></select></div><div class="field"><label>Повідомлення</label><textarea class="input" id="tkMessage" rows="4" placeholder="Опишіть, що трапилось і який результат вам потрібен"></textarea><small>Чутливі звернення бачить тільки відповідна служба.</small></div><div class="modal-foot"><button class="btn btn-ghost" data-act="close">Скасувати</button><button class="btn btn-primary" id="submitTicket">Надіслати</button></div>`);setTimeout(()=>$('#submitTicket').onclick=()=>{if(!$('#tkMessage').value.trim()){toast('Додайте повідомлення');return}APSVT.update(st=>{st.tickets.unshift({id:'t'+Date.now(),studentId:student.id,student:student.name,group:student.group,topic:$('#tkTopic').value,message:$('#tkMessage').value.trim(),date:new Date().toLocaleDateString('uk-UA'),status:'new',priority:'normal',owner:'Не призначено'})},'student-ticket');closeModal();toast('Звернення передано потрібній службі');go('/support')},20)}
$('#modalBack').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});document.addEventListener('click',e=>{if(e.target.closest('[data-act="close"]'))closeModal()});window.addEventListener('apsvt:change',()=>go(route));
let n=0;const counter=setInterval(()=>{n+=7;$('#loadNum').textContent=String(Math.min(n,99)).padStart(2,'0')},70);setTimeout(()=>{clearInterval(counter);$('#loadNum').textContent='100';setTimeout(()=>$('#loader').classList.add('done'),180)},1180);go('/');
</script>
