<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>АПСВТ Start · Кабінет вступника</title><meta name="theme-color" content="#061027">
  <link rel="stylesheet" href="platform.css">
</head>
<body>
<a class="skip" href="#content">До основного вмісту</a>
<div class="loader" id="loader" aria-label="Завантаження кабінету"><div class="loader-orbit"><div class="loader-word">АП<span>СВТ</span><i>start</i></div><div class="loader-meta"><span>admissions journey</span><span id="loadNum">00</span></div></div><i class="loader-progress"></i></div>
<div class="app">
  <aside class="rail">
    <a class="brand" href="#/"><span class="brand-mark">АП</span><span><b>АПСВТ Start</b><small>кабінет вступника</small></span></a>
    <div class="nav-group">Мій вступ</div>
    <nav class="nav" aria-label="Навігація вступника">
      <a href="#/" data-route="/"><span class="nav-icon">01</span>Мій вступ</a>
      <a href="#/application" data-route="/application"><span class="nav-icon">02</span>Заява</a>
      <a href="#/documents" data-route="/documents"><span class="nav-icon">03</span>Документи<span class="nav-count" id="docCount">1</span></a>
      <a href="#/interview" data-route="/interview"><span class="nav-icon">04</span>Співбесіда</a>
      <a href="#/contract" data-route="/contract"><span class="nav-icon">05</span>Договір</a>
      <a href="#/payment" data-route="/payment"><span class="nav-icon">06</span>Оплата</a>
      <a href="#/onboarding" data-route="/onboarding"><span class="nav-icon">07</span>Старт навчання</a>
      <div class="nav-group">Допомога</div>
      <a href="#/help" data-route="/help"><span class="nav-icon">?</span>Підтримка</a>
    </nav>
    <div class="rail-foot"><div class="identity"><span class="avatar" id="applicantAvatar" style="background:linear-gradient(135deg,#2448ff,#8ea0ff)">ОС</span><span><b id="applicantName">Олена Савчук</b><span id="applicantMeta">Вступ 2026 · APP-001</span></span></div><a class="switch-link" href="index.html"><span>Усі простори</span><b>↗</b></a></div>
  </aside>
  <section class="workspace">
    <header class="topbar"><span class="mobile-brand">АПСВТ Start</span><div class="sync"><i></i><span id="syncText">ЄДЕБО синхронізовано</span></div><div class="top-actions"><button class="icon-button" data-act="contrast" title="Висока контрастність">◐</button><button class="icon-button" data-go="/help" title="Допомога">?</button></div></header>
    <main class="main" id="content"><div class="wrap" id="view"></div></main>
  </section>
</div>
<div class="modal-back" id="modalBack"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div><div class="toast" id="toast" role="status"></div>
<script src="platform-sync.js"></script>
<script>
const $=selector=>document.querySelector(selector),view=$('#view'),applicantId='app-001';let route='/';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function S(){return APSVT.get()}function A(){return S().admissions.applicants.find(item=>item.id===applicantId)}
function toast(message){const item=$('#toast');item.textContent=message;item.classList.add('show');clearTimeout(item._timer);item._timer=setTimeout(()=>item.classList.remove('show'),2800)}
function modal(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('open');setTimeout(()=>$('#modal input,#modal select,#modal textarea')?.focus(),30)}function closeModal(){$('#modalBack').classList.remove('open')}
function header(eyebrow,title,description,actions=''){return `<div class="page-head reveal"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div><div class="head-actions">${actions}</div></div>`}
function status(value){const map={verified:['Перевірено','green'],review:['На перевірці','amber'],missing:['Потрібно додати','red'],scheduled:['Заплановано','blue'],not_scheduled:['Не заплановано','gray'],passed:['Складено','green'],failed:['Потрібна повторна спроба','red'],ready:['Готовий до підпису','blue'],waiting:['Очікується','gray'],signed:['Підписано','green'],pending:['Очікує оплати','amber'],paid:['Сплачено','green'],not_required:['Не потрібна','green'],synced:['Синхронізовано','green'],enrolled:['Зараховано','green'],in_review:['Розглядається','amber'],offer:['Рекомендовано','blue'],documents:['Документи','amber'],creating:['Створюється','blue']};const item=map[value]||[value,'gray'];return `<span class="status ${item[1]}">${item[0]}</span>`}
function readiness(app){const docs=app.documents.every(item=>item.status==='verified');return [{label:'Заява та ЄДЕБО',ready:app.edebo.status==='synced',route:'/application'},{label:'Документи',ready:docs,route:'/documents'},{label:'Співбесіда / іспит',ready:app.interview.status==='passed',route:'/interview'},{label:'Договір',ready:app.contract.status==='signed',route:'/contract'},{label:'Оплата',ready:['paid','not_required'].includes(app.payment.status),route:'/payment'}]}
function dashboard(){const app=A(),checks=readiness(app),done=checks.filter(x=>x.ready).length,percentage=Math.round(done/checks.length*100),enrolled=app.status==='enrolled';view.innerHTML=header(`Вступ 2026 · заява ${app.id.toUpperCase()}`,enrolled?'Вітаємо, ви студентка АПСВТ':'Ваш вступ — в одному маршруті',enrolled?'Профіль створено автоматично. Завершіть короткий цифровий онбординг перед початком навчання.':'Слідкуйте за статусом заяви, документами, співбесідою, договором і оплатою без дзвінків та дублювання даних.',enrolled?`<button class="btn btn-primary" data-go="/onboarding">Почати онбординг</button>`:`<button class="btn btn-ghost" data-act="refreshEdebo">Оновити з ЄДЕБО</button>`) + `<div class="grid split"><section class="card hero reveal" style="background:${enrolled?'var(--green)':'var(--blue)'}"><div><div class="eyebrow" style="color:#dce2ff">${enrolled?'Зараховано · наказ сформовано':'Поточний етап · '+(app.stage==='documents'?'перевірка документів':app.stage==='contract'?'договір':'вступна кампанія')}</div><h2>${enrolled?'Ваш студентський профіль готовий':done+' із '+checks.length+' умов виконано'}</h2><p>${enrolled?`${app.onboarding.studentId} · ${app.onboarding.group} · ${app.onboarding.academyEmail}`:'Наступна дія: дочекайтеся перевірки РНОКПП та підготуйтеся до співбесіди 22 липня.'}</p></div><button class="btn" data-go="${enrolled?'/onboarding':'/documents'}">${enrolled?'Відкрити профіль':'Продовжити вступ'}</button></section><aside class="card pad reveal"><div class="row"><h2>Готовність до зарахування</h2><b class="mono">${percentage}%</b></div><div class="progress" style="margin:15px 0 7px"><i style="width:${percentage}%;background:${percentage===100?'var(--green)':'var(--blue)'}"></i></div><p class="muted">Зарахування відбудеться автоматично після виконання всіх умов.</p><ul class="list">${checks.map(item=>`<li><div class="row"><button class="btn btn-ghost btn-sm" data-go="${item.route}">${item.label}</button><span class="status ${item.ready?'green':'gray'}">${item.ready?'Готово':'Очікується'}</span></div></li>`).join('')}</ul></aside></div><div class="grid grid-3" style="margin-top:17px"><section class="card pad reveal"><div class="eyebrow">Обрана програма</div><h2 style="font-size:18px">${esc(app.program)}</h2><p class="muted">${app.degree} · ${app.form} форма · ${app.funding}</p><div class="row" style="margin-top:16px"><span class="status blue">Пріоритет ${app.priority}</span><button class="btn btn-ghost btn-sm" data-go="/application">Деталі</button></div></section><section class="card pad reveal"><div class="eyebrow">Найближча подія</div><h2 style="font-size:18px">${app.interview.status==='passed'?'Співбесіду складено':'Мотиваційна співбесіда'}</h2><p class="muted">${app.interview.date||'Дата уточнюється'} · ${app.interview.time||'—'} · ${app.interview.format||'—'}</p><div class="row" style="margin-top:16px">${status(app.interview.status)}<button class="btn btn-ghost btn-sm" data-go="/interview">Відкрити</button></div></section><section class="card pad reveal"><div class="eyebrow">ЄДЕБО</div><h2 style="font-size:18px">Дані без дублювання</h2><p class="muted">${app.edebo.id||'Ідентифікатор ще формується'} · оновлено ${app.edebo.updatedAt||'—'}</p><div class="row" style="margin-top:16px">${status(app.edebo.status)}<button class="btn btn-ghost btn-sm" data-act="refreshEdebo">Синхронізувати</button></div></section></div><section class="card pad reveal" style="margin-top:17px"><div class="row mobile-stack"><div><div class="eyebrow">Що відбувається далі</div><h2>Ваша персональна послідовність</h2></div><span class="status green">Сповіщення увімкнено</span></div><div class="timeline" style="margin-top:20px">${checks.map((item,index)=>`<div class="event"><b>${String(index+1).padStart(2,'0')} · ${item.label}</b><p>${item.ready?'Етап завершено й зафіксовано у системі.':'Система повідомить, коли потрібна ваша дія.'}</p></div>`).join('')}</div></section>`}
function application(){const app=A();view.innerHTML=header('Цифрова заява','Моя заява','Дані програми, пріоритет, джерело фінансування та статус обміну з ЄДЕБО.',`<button class="btn btn-ghost" data-act="downloadApplication">Завантажити копію</button>`) + `<div class="grid split"><section class="card pad reveal"><div class="row"><div><div class="eyebrow">${app.id.toUpperCase()}</div><h2 style="font-size:20px">${esc(app.program)}</h2></div>${status(app.status)}</div><div class="grid grid-2" style="margin-top:20px"><div class="card pad" style="box-shadow:none"><div class="metric-label">Рівень</div><b>${app.degree}</b></div><div class="card pad" style="box-shadow:none"><div class="metric-label">Форма</div><b>${app.form}</b></div><div class="card pad" style="box-shadow:none"><div class="metric-label">Фінансування</div><b>${app.funding}</b></div><div class="card pad" style="box-shadow:none"><div class="metric-label">Пріоритет</div><b>${app.priority}</b></div></div><ul class="list" style="margin-top:12px"><li><div class="row"><span class="muted">Подано</span><b>${app.submittedAt}</b></div></li><li><div class="row"><span class="muted">Вступник</span><b>${esc(app.name)}</b></div></li><li><div class="row"><span class="muted">Контактна пошта</span><b>${esc(app.email)}</b></div></li><li><div class="row"><span class="muted">Телефон</span><b>${esc(app.phone)}</b></div></li></ul></section><aside class="grid"><section class="card pad reveal"><div class="row"><h2>Обмін з ЄДЕБО</h2>${status(app.edebo.status)}</div><div class="metric-value" style="font-size:23px">${app.edebo.id||'Очікується'}</div><p class="muted">Персональні й конкурсні дані синхронізуються без повторного введення.</p><button class="btn btn-primary" style="margin-top:15px" data-act="refreshEdebo">Оновити дані</button></section><section class="card notice reveal"><div class="eyebrow">Важливо</div><h2>Зміна конкурсної пропозиції</h2><p style="margin-top:8px">Після подання зміни програми або пріоритету здійснюються відповідно до правил вступної кампанії. Надішліть запит приймальній комісії.</p><button class="btn btn-dark btn-sm" style="margin-top:14px" data-go="/help">Поставити питання</button></section></aside></div>`}
function documents(){const app=A(),verified=app.documents.filter(x=>x.status==='verified').length;view.innerHTML=header('Документи без черг','Документи вступника','Завантажуйте файли один раз. Приймальна комісія перевіряє їх, а статус одразу зʼявляється тут.',`<button class="btn btn-primary" data-act="uploadExtra">Додати документ</button>`) + `<div class="grid grid-3"><section class="card metric green reveal"><div class="metric-label">Перевірено</div><div class="metric-value">${verified}</div><div class="metric-foot">з ${app.documents.length} документів</div></section><section class="card metric yellow reveal"><div class="metric-label">На перевірці</div><div class="metric-value">${app.documents.filter(x=>x.status==='review').length}</div><div class="metric-foot">відповідь до 1 робочого дня</div></section><section class="card metric reveal"><div class="metric-label">Передано з ЄДЕБО</div><div class="metric-value">2</div><div class="metric-foot">без повторного завантаження</div></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Обовʼязковий комплект</h2><span class="muted">PDF, JPG або PNG · до 10 МБ</span></div><div class="table-wrap"><table><thead><tr><th>Документ</th><th>Файл</th><th>Статус</th><th>Коментар</th><th></th></tr></thead><tbody>${app.documents.map(doc=>`<tr><td class="table-title">${esc(doc.title)}</td><td>${doc.file?esc(doc.file):'—'}</td><td>${status(doc.status)}</td><td class="muted">${doc.status==='verified'?'Дані збігаються':doc.status==='review'?'Перевіряє приймальна комісія':'Файл ще не додано'}</td><td><button class="btn btn-ghost btn-sm" data-upload-doc="${doc.id}">${doc.file?'Замінити':'Завантажити'}</button></td></tr>`).join('')}</tbody></table></div></section><section class="card pad reveal" style="margin-top:17px"><div class="row mobile-stack"><div><h2>Як відбувається перевірка</h2><p class="muted">Працівник звіряє читабельність, персональні дані й відповідність заяві. Автоматичне рішення не приймається.</p></div><span class="status blue">Людська перевірка</span></div></section>`}
function interview(){const app=A(),event=app.interview;view.innerHTML=header('Вступне випробування','Співбесіда та іспит','Дата, формат, матеріали для підготовки й результат — у єдиній картці.',`<button class="btn btn-ghost" data-act="calendar">Додати в календар</button>`) + `<div class="grid split"><section class="card hero reveal" style="background:var(--navy)"><div><div class="eyebrow">${event.status==='passed'?'Результат опубліковано':'Заплановано · '+event.format}</div><h2>${event.status==='passed'?'Співбесіду успішно складено':event.date+' · '+event.time}</h2><p>${esc(event.note)}. ${event.room?esc(event.room):''}</p></div>${event.status==='passed'?`<span class="status green">${event.score} балів</span>`:`<button class="btn" data-act="joinInterview">${event.format==='Онлайн'?'Перевірити підключення':'Побудувати маршрут'}</button>`}</section><aside class="card pad reveal"><h2>Деталі події</h2><ul class="list"><li><div class="row"><span class="muted">Дата</span><b>${event.date||'Очікується'}</b></div></li><li><div class="row"><span class="muted">Час</span><b>${event.time||'—'}</b></div></li><li><div class="row"><span class="muted">Формат</span><b>${event.format||'—'}</b></div></li><li><div class="row"><span class="muted">Місце</span><b>${event.room||'—'}</b></div></li><li><div class="row"><span class="muted">Статус</span>${status(event.status)}</div></li></ul>${event.status!=='passed'?`<button class="btn btn-ghost" style="width:100%;margin-top:16px" data-act="reschedule">Запросити інший час</button>`:''}</aside></div><div class="grid grid-2" style="margin-top:17px"><section class="card pad reveal"><h2>Підготуйтеся заздалегідь</h2><ul class="list"><li><b>Мотивація</b><p class="muted">Чому ви обрали програму й які маєте професійні цілі.</p></li><li><b>Досвід</b><p class="muted">Навчальні, волонтерські або робочі проєкти, якими пишаєтеся.</p></li><li><b>Ваші питання</b><p class="muted">Підготуйте 1–2 питання про програму або студентські можливості.</p></li></ul></section><section class="card pad reveal"><div class="eyebrow">Технічна перевірка</div><h2>Камера, мікрофон і стабільний звʼязок</h2><p class="muted" style="margin-top:8px">Увійдіть за 10 хвилин. Підготуйте документ, що посвідчує особу.</p><button class="btn btn-yellow" style="margin-top:16px" data-act="joinInterview">Запустити перевірку</button></section></div>`}
function contract(){const app=A(),contract=app.contract;view.innerHTML=header('Договір про навчання','Підписання договору','Перегляньте умови, завантажте копію та підпишіть документ електронно.',contract.status==='signed'?`<button class="btn btn-ghost" data-act="downloadContract">Завантажити підписаний</button>`:'') + `<div class="grid split"><section class="card pad reveal"><div class="row mobile-stack"><div><div class="eyebrow">${contract.number||'Номер формується'}</div><h2 style="font-size:20px">Договір про надання освітніх послуг</h2></div>${status(contract.status)}</div><ul class="list" style="margin-top:16px"><li><div class="row"><span class="muted">Освітня програма</span><b>${esc(app.program)}</b></div></li><li><div class="row"><span class="muted">Рівень і форма</span><b>${app.degree} · ${app.form}</b></div></li><li><div class="row"><span class="muted">Фінансування</span><b>${app.funding}</b></div></li><li><div class="row"><span class="muted">Вартість першого року</span><b>${app.payment.amount?app.payment.amount.toLocaleString('uk-UA')+' грн':'Бюджетне місце'}</b></div></li><li><div class="row"><span class="muted">Підпис</span><b>${contract.signedAt?contract.method+' · '+contract.signedAt:'Ще не накладено'}</b></div></li></ul><div class="row mobile-stack" style="margin-top:18px"><button class="btn btn-ghost" data-act="previewContract">Переглянути умови</button>${contract.status!=='signed'?`<button class="btn btn-primary" data-act="signContract" ${contract.status==='waiting'?'disabled':''}>Підписати електронно</button>`:`<span class="status green">Копію збережено</span>`}</div></section><aside class="grid"><section class="card notice reveal"><div class="eyebrow">Перед підписанням</div><h2>Перевірте програму, форму й вартість</h2><p style="margin-top:8px">Якщо дані не збігаються із заявою, не підписуйте документ і зверніться до приймальної комісії.</p></section><section class="card pad reveal"><h2>Доступні способи</h2><ul class="list"><li><div class="row"><span>КЕП</span><span class="status green">Доступно</span></div></li><li><div class="row"><span>Дія.Підпис</span><span class="status green">Доступно</span></div></li><li><div class="row"><span>Особисто в Академії</span><span class="status blue">За записом</span></div></li></ul></section></aside></div>`}
function payment(){const app=A(),payment=app.payment;view.innerHTML=header('Оплата без невизначеності','Оплата вступного платежу','Сума, строк, підтвердження платежу й електронна квитанція повʼязані з договором.',payment.receipt?`<button class="btn btn-ghost" data-act="downloadReceipt">Завантажити квитанцію</button>`:'') + `<div class="grid split"><section class="card hero reveal" style="background:${payment.status==='paid'?'var(--green)':'var(--blue)'}"><div><div class="eyebrow">${payment.status==='paid'?'Платіж підтверджено':'До сплати · до '+payment.due}</div><h2>${payment.amount.toLocaleString('uk-UA')} грн</h2><p>${payment.status==='paid'?`Квитанція ${payment.receipt} · сплачено ${payment.paidAt}`:`Перший платіж за договором ${app.contract.number}. Статус оновиться одразу після демонстраційної оплати.`}</p></div>${payment.status==='paid'?`<span class="status green">Зараховано</span>`:`<button class="btn" data-act="pay">Сплатити онлайн</button>`}</section><aside class="card pad reveal"><h2>Платіжні реквізити</h2><ul class="list"><li><div class="row"><span class="muted">Одержувач</span><b>АПСВТ</b></div></li><li><div class="row"><span class="muted">Призначення</span><b>${app.id.toUpperCase()}</b></div></li><li><div class="row"><span class="muted">Договір</span><b>${app.contract.number||'Очікується'}</b></div></li><li><div class="row"><span class="muted">Статус</span>${status(payment.status)}</div></li></ul></aside></div><section class="card pad reveal" style="margin-top:17px"><div class="row mobile-stack"><div><h2>Потрібне розтермінування?</h2><p class="muted">Подайте запит до підписання договору або першого платежу. Рішення приймає уповноважений працівник.</p></div><button class="btn btn-ghost" data-act="installment">Подати запит</button></div></section>`}
function onboarding(){const app=A(),ready=app.status==='enrolled',o=app.onboarding;view.innerHTML=header('Від вступника до студента','Старт навчання',ready?'Студентський профіль створено автоматично — завершіть знайомство з цифровими сервісами.':'Цей розділ відкриється автоматично після виконання всіх умов зарахування.',ready?`<a class="btn btn-primary" href="student.html">Увійти як студентка</a>`:'') + (ready?`<div class="grid grid-3"><section class="card metric green reveal"><div class="metric-label">Студентський ID</div><div class="metric-value" style="font-size:22px">${o.studentId}</div><div class="metric-foot">створено автоматично</div></section><section class="card metric reveal"><div class="metric-label">Навчальна група</div><div class="metric-value">${o.group}</div><div class="metric-foot">${esc(app.program)}</div></section><section class="card metric yellow reveal"><div class="metric-label">Цифровий квиток</div><div class="metric-value" style="font-size:23px">Створюється</div><div class="metric-foot">QR зʼявиться до 25 серпня</div></section></div><div class="grid split" style="margin-top:17px"><section class="card pad reveal"><div class="row"><h2>Ваш чекліст першого входу</h2><span class="status blue">2 з 5</span></div><ul class="list"><li><div class="row"><div><b>Пошта Академії</b><p class="muted">${esc(o.academyEmail)}</p></div><span class="status green">Готово</span></div></li><li><div class="row"><div><b>Студентський профіль</b><p class="muted">Програма, група та форма навчання</p></div><span class="status green">Готово</span></div></li><li><div class="row"><div><b>Двоетапний вхід</b><p class="muted">Захистіть обліковий запис</p></div><button class="btn btn-ghost btn-sm" data-act="setupMfa">Налаштувати</button></div></li><li><div class="row"><div><b>Фото для цифрового квитка</b><p class="muted">Використаємо перевірене фото із заяви</p></div><button class="btn btn-ghost btn-sm" data-act="confirmPhoto">Підтвердити</button></div></li><li><div class="row"><div><b>Орієнтаційний курс</b><p class="muted">Кампус, навчання, підтримка й академічна доброчесність</p></div><button class="btn btn-primary btn-sm" data-act="orientation">Почати</button></div></li></ul></section><aside class="card notice reveal"><div class="eyebrow">Перший навчальний день</div><h2>1 вересня · 09:00</h2><p style="margin-top:8px">Зустріч групи ${o.group}, знайомство з куратором та екскурсія кампусом.</p><a class="btn btn-dark" style="margin-top:18px" href="student.html">Перейти до myАПСВТ</a></aside></div>`:`<section class="card pad reveal"><div class="empty-state"><div class="metric-value" style="color:var(--blue)">${readiness(app).filter(x=>x.ready).length}/5</div><b>Онбординг ще закритий</b><p class="muted">Завершіть документи, співбесіду, договір та оплату. Система автоматично створить студентський профіль.</p><button class="btn btn-primary" style="margin-top:16px" data-go="/">Перевірити готовність</button></div></section>`)}
function help(){const app=A(),tickets=S().tickets.filter(item=>item.applicantId===app.id);view.innerHTML=header('Приймальна комісія поруч','Підтримка вступника','Поставте питання про заяву, документи, співбесіду, договір або оплату.',`<button class="btn btn-primary" data-act="newAdmissionTicket">Нове звернення</button>`) + `<div class="grid grid-3"><section class="card pad reveal"><div class="eyebrow">Телефон</div><h2>0 800 33 48 17</h2><p class="muted">Пн–Пт · 09:00–18:00<br>Дзвінки в Україні безкоштовні</p></section><section class="card pad reveal"><div class="eyebrow">Онлайн-чат</div><h2>Середня відповідь · 8 хв</h2><p class="muted">Не надсилайте паспортні або платіжні дані у повідомленні.</p></section><section class="card pad reveal"><div class="eyebrow">Візит</div><h2>Київ · кабінет 105</h2><p class="muted">Попередній запис · доступний безбарʼєрний вхід.</p></section></div><section class="card reveal" style="margin-top:17px"><div class="card-head"><h2>Мої звернення</h2><span class="status blue">${tickets.length}</span></div><div class="table-wrap"><table><thead><tr><th>Тема</th><th>Повідомлення</th><th>Відповідальний</th><th>Статус</th></tr></thead><tbody>${tickets.map(ticket=>`<tr><td class="table-title">${esc(ticket.topic)}</td><td>${esc(ticket.message)}</td><td>${esc(ticket.owner)}</td><td>${status(ticket.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Звернень ще немає.</td></tr>'}</tbody></table></div></section>`}

function go(path){route=routes[path]?path:'/';routes[route]();document.querySelectorAll('[data-route]').forEach(link=>link.classList.toggle('active',link.dataset.route===route));const app=A();$('#docCount').textContent=app.documents.filter(item=>item.status!=='verified').length;$('#syncText').textContent=app.edebo.status==='synced'?'ЄДЕБО · '+app.edebo.updatedAt:'ЄДЕБО · очікує синхронізації';scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#/"]');if(link){event.preventDefault();go(link.getAttribute('href').slice(1)||'/');return}const target=event.target.closest('[data-go]');if(target){go(target.dataset.go);return}const upload=event.target.closest('[data-upload-doc]');if(upload){uploadDocument(upload.dataset.uploadDoc);return}const action=event.target.closest('[data-act]')?.dataset.act;if(!action)return;if(action==='contrast'){document.body.classList.toggle('high-contrast');toast('Контрастність змінено')}else if(action==='refreshEdebo')refreshEdebo();else if(action==='uploadExtra')uploadDocument('extra');else if(action==='calendar')downloadCalendar();else if(action==='reschedule')rescheduleModal();else if(action==='joinInterview')toast('Перевірено: камера, мікрофон і зʼєднання працюють');else if(action==='signContract')signContractModal();else if(action==='pay')paymentModal();else if(action==='newAdmissionTicket')ticketModal();else if(action==='downloadApplication')downloadText('application-'+applicantId+'.txt',applicationCopy());else if(action==='downloadContract')downloadText('contract-'+A().contract.number+'.txt','Підписаний електронний договір '+A().contract.number);else if(action==='downloadReceipt')downloadText(A().payment.receipt+'.txt','Квитанція '+A().payment.receipt+' · '+A().payment.amount+' грн');else if(action==='previewContract')contractPreview();else if(action==='installment')toast('Запит на розтермінування надіслано фінансовому менеджеру');else if(['setupMfa','confirmPhoto','orientation'].includes(action))toast('Крок онбордингу відкрито · демонстраційна дія')});
function refreshEdebo(){APSVT.update(state=>{const app=state.admissions.applicants.find(item=>item.id===applicantId);app.edebo.status='synced';app.edebo.id=app.edebo.id||'EDBO-2026-'+String(Date.now()).slice(-6);app.edebo.updatedAt=APSVT.stamp();APSVT.addAudit(`Синхронізовано заяву ${app.id} з ЄДЕБО`,'Вступ',app.name)},'applicant-edebo');toast('Дані ЄДЕБО оновлено без повторного введення');go(route)}
function uploadDocument(id){const app=A(),doc=app.documents.find(item=>item.id===id);modal(`<h2>${doc?'Замінити документ':'Додати документ'}</h2><div class="field"><label>Тип документа</label>${doc?`<input class="input" value="${esc(doc.title)}" disabled>`:`<select class="input" id="docTitle"><option>Мотиваційний лист</option><option>Документ про зміну прізвища</option><option>Пільговий документ</option></select>`}</div><div class="field"><label>Файл</label><input class="input" id="docFile" type="file" accept=".pdf,.jpg,.jpeg,.png"><small>PDF, JPG або PNG · до 10 МБ</small></div><div class="field"><label style="font-weight:500"><input type="checkbox" id="docConfirm"> Підтверджую, що копія повна й читабельна</label></div><div class="modal-foot"><button class="btn btn-ghost" data-close>Скасувати</button><button class="btn btn-primary" id="saveDocument">Надіслати на перевірку</button></div>`);setTimeout(()=>$('#saveDocument').onclick=()=>{if(!$('#docConfirm').checked){toast('Підтвердьте якість копії');return}APSVT.update(state=>{const applicant=state.admissions.applicants.find(item=>item.id===applicantId),existing=applicant.documents.find(item=>item.id===id);if(existing){existing.status='review';existing.file=$('#docFile').files[0]?.name||existing.file||'document.pdf'}else applicant.documents.push({id:'extra-'+Date.now(),title:$('#docTitle').value,status:'review',file:$('#docFile').files[0]?.name||'additional-document.pdf'});APSVT.addAudit(`Вступник завантажив документ до заяви ${applicant.id}`,'Вступ',applicant.name)},'applicant-document');closeModal();toast('Документ надіслано на перевірку');go('/documents')},20)}
function rescheduleModal(){modal(`<h2>Запросити інший час</h2><div class="field"><label>Бажана дата</label><input class="input" id="newDate" type="date" value="2026-07-23"></div><div class="field"><label>Час</label><select class="input" id="newTime"><option>10:00</option><option>11:20</option><option>13:00</option><option>15:20</option></select></div><div class="field"><label>Причина</label><textarea class="input" id="newReason" rows="3" placeholder="Коротко поясніть причину"></textarea></div><div class="modal-foot"><button class="btn btn-ghost" data-close>Скасувати</button><button class="btn btn-primary" id="sendReschedule">Надіслати запит</button></div>`);setTimeout(()=>$('#sendReschedule').onclick=()=>{APSVT.update(state=>{const app=state.admissions.applicants.find(item=>item.id===applicantId);app.interview.status='reschedule_requested';APSVT.addAudit(`Запитано новий час співбесіди для ${app.id}`,'Вступ',app.name)},'applicant-interview');closeModal();toast('Запит на інший час надіслано');go('/interview')},20)}
function signContractModal(){const app=A();modal(`<h2>Електронне підписання</h2><p class="muted" style="margin-bottom:16px">Договір ${app.contract.number} · ${esc(app.program)}</p><div class="field"><label>Спосіб підписання</label><select class="input" id="signMethod"><option>Дія.Підпис</option><option>КЕП</option></select></div><div class="field"><label>Підтвердження ПІБ</label><input class="input" id="signName" placeholder="${esc(app.name)}"></div><div class="field"><label style="font-weight:500"><input type="checkbox" id="acceptContract"> Я прочитала та приймаю умови договору</label></div><div class="modal-foot"><button class="btn btn-ghost" data-close>Скасувати</button><button class="btn btn-primary" id="confirmSign">Підписати</button></div>`);setTimeout(()=>$('#confirmSign').onclick=()=>{if($('#signName').value.trim().toLowerCase()!==app.name.toLowerCase()||!$('#acceptContract').checked){toast('Підтвердьте ПІБ та прийняття умов');return}APSVT.update(state=>{const applicant=state.admissions.applicants.find(item=>item.id===applicantId);applicant.contract.status='signed';applicant.contract.signedAt=APSVT.stamp();applicant.contract.method=$('#signMethod').value;applicant.stage='payment';APSVT.addAudit(`Підписано договір ${applicant.contract.number}`,'Вступ',applicant.name)},'applicant-contract');closeModal();toast('Договір підписано та передано до приймальної комісії');go('/contract')},20)}

function downloadText(filename,content){const blob=new Blob([content],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Файл підготовлено')}
